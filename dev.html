<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Dragon Ball Survivors</title>
  <meta name="description" content="Fan game de supervivencia por hordas inspirado en Dragon Ball Z con los sprites de Legacy of Goku y Buu's Fury." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23ff9a1a%22 stroke=%22%23000%22/%3E%3Cpath d=%22M8 4l1 3h3l-2.5 2 1 3L8 10l-2.5 2 1-3L4 7h3z%22 fill=%22%23d42020%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="xpbar"><div id="xpfill"></div><span id="lvl">Nv 1</span></div>
    <div class="hud-row">
      <div class="hud-left">
        <div class="who">
          <canvas id="portrait" class="portrait" width="48" height="48"></canvas>
          <div class="who-bars">
            <div class="hpbar"><div id="hpfill"></div><span id="hptext"></span></div>
            <div id="kibar" class="kibar"><div id="kifill"></div><span>KI</span></div>
            <div id="form" class="form"></div>
          </div>
        </div>
        <div id="slots" class="slots"></div>
        <div id="buffs" class="buffs"></div>
      </div>
      <div class="hud-center"></div>
      <div class="hud-right">
        <div id="kills">☠ 0</div>
        <div id="coins">Ƶ 0</div>
        <div id="crys"></div>
        <div id="dballs" class="dballs"></div>
      </div>
    </div>
    <div id="bossbar" class="bossbar hidden"><span id="bossname"></span><div id="bossfill"></div></div>
    <div id="slotbar" class="slotbar"></div>
    <button id="ultbtn" class="ultbtn" aria-label="Ataque definitivo">KI</button>
    <button id="pausebtn" class="pausebtn" aria-label="Pausa">II</button>
  </div>

  <div id="banner" class="banner"></div>
  <div id="toasts" class="toasts"></div>

  <!-- Pantallas -->
  <div id="screen" class="screen"></div>

  <!-- Versión de desarrollo: carga los módulos de src/ (necesita servidor: npm run dev). -->

  <script type="module" src="src/main.js"></script>
</body>
</html>
